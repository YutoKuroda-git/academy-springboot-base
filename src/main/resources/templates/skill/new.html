<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>項目追加</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/header :: header('items')}"></header>

  <main class="main">
    <h1 class="page-title" th:text="${categoryName} + 'に項目を追加'">項目追加</h1>

    <form class="form" th:action="@{/skills}" th:object="${learningDataForm}" method="post">
      <input type="hidden" th:field="*{categoryId}">
      <input type="hidden" th:field="*{month}">

      <div class="form-group">
        <label class="form-label" for="itemName">項目名</label>
        <input type="text" id="itemName" class="form-input" th:field="*{itemName}">
        <p class="error" th:if="${#fields.hasErrors('itemName')}"
           th:text="${#fields.errors('itemName')[0]}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="learningTime">学習時間</label>
        <input type="text" id="learningTime" class="form-input"
               inputmode="numeric" th:field="*{learningTime}">
        <p class="error" th:if="${#fields.hasErrors('learningTime')}"
           th:text="${#fields.errors('learningTime')[0]}"></p>
      </div>

      <button type="submit" class="form-button">項目を追加する</button>
    </form>
  </main>

  <div class="modal" th:if="${success}">
    <div class="modal-content">
      <p class="modal-text">
        <span th:text="|${categoryName}に${addedItemName}を|"></span>
        <span th:text="|${addedLearningTime}分で追加しました！|"></span>
      </p>
      <a class="form-button" th:href="@{/skills(month=${learningDataForm.month})}">編集ページに戻る</a>
    </div>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
