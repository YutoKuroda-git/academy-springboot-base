<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>項目一覧</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments/header :: header('items')}"></header>
  
  <main class="main main--items">
    <div class="items-container">
      
      <form th:action="@{/skills}" method="get">
        <select class="month-select" name="month" onchange="this.form.submit()">
          <option th:each="m : ${months}"
          th:value="${m}"
          th:text="${m} + '月'"
          th:selected="${m == selectedMonth}"></option>
        </select>
      </form>
      
      <section class="category-card" th:each="category : ${categories}">
        <div class="category-header">
          <h2 class="category-title" th:text="${category.name}">カテゴリ</h2>
          <a class="btn-add" th:href="@{/skills/new(categoryId=${category.id},month=${selectedMonth})}">項目を追加する</a>
        </div>
        
        <div class="item-card">
          <table class="item-table">
            <thead>
              <tr>
                <th>項目名</th>
                <th>学習時間</th>
                <th></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${category.learningDataList}">
                <td>
                  <form th:id="|edit-form-${item.id}|"
                        th:action="@{/skills/{id}/edit(id=${item.id})}"
                        method="post"></form>
                  <input type="hidden" name="month" th:value="${selectedMonth}"
                        th:form="|edit-form-${item.id}|">
                  <span th:text="${item.itemName}">項目名</span>
                </td>
                <td>
                  <input class="item-time-input" type="number"
                        name="learningTime"
                        th:form="|edit-form-${item.id}|"
                        th:value="${errorItemId == item.id ? errorValue : (item.learningTime ?: 0)}"
                        min="0">
                  <p class="error" th:if="${errorItemId == item.id}" th:text="${errorMessage}"></p>
                </td>
                <td>
                  <button type="submit" class="btn-save"
                          th:form="|edit-form-${item.id}|">学習時間を保存する</button>
                </td>
                <td><button type="button" class="btn-delete">削除する</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      
    </div>
  </main>

  <div class="modal" th:if="${editSuccess}">
    <div class="modal-content">
      <p class="modal-text">
        <span th:text="|${editedItemName}の学習時間を保存しました！|"></span>
      </p>
      <a class="form-button" th:href="@{/skills(month=${selectedMonth})}">編集ページに戻る</a>
    </div>
  </div>
  
  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
